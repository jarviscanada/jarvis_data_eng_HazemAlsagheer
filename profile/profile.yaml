jarvis_projects:
  - name: "Linux Cluster Monitoring System"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_HazemAlsagheer/tree/develop/linux_sql"
    
    description: "Built a lightweight Linux cluster monitoring system where each node collects hardware specifications and real-time resource metrics and sends them to a centralized PostgreSQL database. Designed the system to give administrators clear visibility into CPU, memory, and disk usage for better resource allocation and capacity planning. Implemented a Bash-based agent using tools like vmstat and df, with data ingestion handled through a containerized database deployed via Docker. Automated data collection with cron and validated accuracy through script testing and SQL-based analysis."

# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
  - name: "Journaling app: Echos of Ink"
    git_url: "https://github.com/Hazem0012/JournalingApp"    
    description: "Designed and deployed a full-stack journaling application with a focus on reliable data flow and secure system architecture. Built a FastAPI backend with JWT-based authentication and refresh token rotation, paired with a React TypeScript frontend using Axios interceptors to manage concurrent requests and session state. Modeled and managed relational data in PostgreSQL, including token lifecycle handling for security and consistency. Containerized the application with Docker and deployed it on AWS EC2 behind an Nginx reverse proxy with HTTPS, ensuring scalable and production-like behavior across environments."

  - name: "Capstone Project: Biomedical Quesiton Answering Model"
    description: "Built a biomedical question-answering system by fine-tuning BioBERT on 3K+ BioASQ list-type questions, improving F1-score from 3% to 53.7% through a custom multi-span extraction strategy. Designed a post-processing pipeline to rank and filter top-N predictions, reducing redundancy and improving answer precision. Focused on optimizing the end-to-end data and inference pipeline to ensure accurate, structured outputs for domain-specific queries."


